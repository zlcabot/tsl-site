name = "tsl-mcp"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Public, read-only MCP server for thisspirituallife.com. No auth: the
# corpus is public. Reads the site's own build artifacts at request time
# (static/contentIndex.json, static/claims.json), so it never drifts from
# what is published.
[vars]
SITE = "https://thisspirituallife.com"
GITHUB_REPO = "zlcabot/tsl-site"

# Secret (wrangler secret put GITHUB_TOKEN): a token able to open issues
# on GITHUB_REPO. Only submit_answer uses it; without it, submit_answer
# returns the /answer channels instead of failing.

[[ratelimits]]
name = "ANSWER_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
