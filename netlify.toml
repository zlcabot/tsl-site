[build]
  command = "npx quartz build && node scripts/build-llms-full.mjs && node scripts/inject-jsonld.mjs"
  publish = "public"

# Old Squarespace-era URLs (complete set, from its sitemap) -> new homes
[[redirects]]
  from = "/about-zayin-cabot"
  to = "/about"
  status = 301

[[redirects]]
  from = "/about-tsl-podcast"
  to = "/podcast/"
  status = 301

[[redirects]]
  from = "/about-this-spiritual-life"
  to = "/foundations"
  status = 301

[[redirects]]
  from = "/about-this-spiritual-life/*"
  to = "/foundations"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# /writing merged into /books (2026-08-09)
[[redirects]]
  from = "/writing"
  to = "/books"
  status = 301

[build.environment]
  NODE_VERSION = "22"
