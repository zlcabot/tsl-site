[build]
  command = "npm run validate:content && npx quartz build && node scripts/build-llms-full.mjs && node scripts/inject-jsonld.mjs && node scripts/sidenotes.mjs && node scripts/answer-block.mjs && node scripts/build-claims.mjs"
  publish = "public"

# Old Squarespace-era URLs (complete set, from its sitemap) -> new homes
[[redirects]]
  from = "/about-zayin-cabot"
  to = "/about"
  status = 301

[[redirects]]
  from = "/about-tsl-podcast"
  to = "/podcast/"
  status = 301

[[redirects]]
  from = "/about-this-spiritual-life"
  to = "/foundations"
  status = 301

[[redirects]]
  from = "/about-this-spiritual-life/*"
  to = "/foundations"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# /notes renamed /wiki (2026-08-09)
[[redirects]]
  from = "/notes/*"
  to = "/wiki/:splat"
  status = 301

# /writing and /books consolidated at /publications (2026-08-09)
[[redirects]]
  from = "/writing"
  to = "/publications"
  status = 301

[[redirects]]
  from = "/books"
  to = "/publications"
  status = 301

# MCP server: the Worker is proxied here so the public endpoint is on the
# site's own domain and the workers.dev hostname never has to be published.
[[redirects]]
  from = "/mcp"
  to = "https://tsl-mcp.zcabotresearch.workers.dev/"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/*"
  to = "https://tsl-mcp.zcabotresearch.workers.dev/:splat"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "22"
